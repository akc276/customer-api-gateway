spring:
  application:
    name: consumer-api-gateway

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/gateway}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092} # Resolved to eventhubs-emulator:9092 in compose
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer # Serializes message keys as UTF-8 strings
      value-serializer: org.apache.kafka.common.serialization.StringSerializer # Serializes message values as UTF-8 strings


management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: DEBUG
