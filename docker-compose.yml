services:
  mongodb:
    image: mongo:8
    container_name: gateway-mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INIT_DATABASE: gateway
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.4-alpine
    container_name: gateway-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  artifactory:
    image: releases-docker.jfrog.io/jfrog/artifactory-oss:7.77.5 # official artifactory open source image
    container_name: gateway-artifactory
    ports:
      - "8081:8081" # Artifactory REST API & Docker Registry port
      - "8082:8082" # Artifactory Web management  UI port
    volumes:
      - artifactory_data:/var/opt/jfrog/artifactory

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: gateway-azurite
    command: "azurite --blobHost 0.0.0.0 --tableHost 0.0.0.0 --queueHost 0.0.0.0"
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"

  eventhubs-emulator:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest
    container_name: gateway-eventhubs
    ports:
      - "5672:5672"
      - "9092:9092" # Exposes local kafka protocol port for publishing and consuming events
      - "5300:5300"
    environment:
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
      ACCEPT_EULA: "Y" # Required microsoft EULA acceptance flag
      CONFIG_PATH: "/workspace/schema/Config.json"
    volumes:
      - ./eventhubs-config.json:/Eventhubs_Emulator/ConfigFiles/Config.json
    depends_on:
      - azurite

  gateway:
    build:
      context: . # Uses this project folder as the Docker build context
      dockerfile: Dockerfile # Builds the gateway image from your Dockerfile
    image: consumer-api-gateway:local # Applies a predictable name and tag to the built image
    container_name: gateway-api
    ports:
      - "8080:8080" # Exposes the gateway from it's container to your system
    environment:
      MONGODB_URI: mongodb://mongodb:27017/gateway # `mongodb` resolves through compose's internal DNS.
      REDIS_HOST: redis
      REDIS_PORT: "6379" # Quoted so, yaml explicitly treats it like a string
      KAFKA_BOOTSTRAP_SERVERS: eventhubs-emulator:9092
    depends_on:
      - mongodb # Starts mongodb before gateway
      - redis # Starts redis before gateway
      - eventhubs-emulator # Ensures event broker is up before gateway starts

  # 7. ArgoCD Built-in Web UI Dashboard
