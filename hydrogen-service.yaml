# hydrogen-service.yaml registers this gateway microservice in the Hydrogen UI Developer Portal.
apiVersion: hydrogen.internal/v1alpha1
kind: Component
metadata:
  name: consumer-api-gateway # Service identifier displayed in Hydrogen UI portal
  title: Consumer API Gateway # Human-readable title
  description: Unified Kotlin Spring Boot API gateway providing routing, OAuth2 security, and Event Hub audit events.
  annotations:
    # Links Hydrogen UI directly to our ArgoCD application for 1-click syncs and restarts
    argocd/app-name: consumer-api-gateway
    # Links Hydrogen UI to the source repository
    github.com/project-slug: your-org/consumer-api-gateway
    # Links Hydrogen UI to New Relic APM for integrated telemetry and AI log analysis
    newrelic.com/app-name: consumer-api-gateway-prod
spec:
  type: service # Defines this component as a backend microservice
  lifecycle: production # Deployment lifecycle environment
  owner: backend-team # Team responsible for service ownership
  system: api-gateway-system # Architectural system grouping